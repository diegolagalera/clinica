# =============================================
#  CUSPIA-ERP — Production Docker Compose
# =============================================
#  Usage:
#    cp .env.prod.example .env.prod
#    # Edit .env.prod with your real values
#    docker compose -f docker-compose.prod.yml up -d --build
# =============================================

services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: cuspia_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-cuspia}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dental_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-cuspia}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  postgres-central:
    image: postgres:16-alpine
    container_name: cuspia_central_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-cuspia}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cuspia_central
    volumes:
      - postgres_central_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-cuspia}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: cuspia_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    image: minio/minio:latest
    container_name: cuspia_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  minio-init:
    image: minio/mc:latest
    container_name: cuspia_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set myminio http://minio:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASSWORD}; mc mb --ignore-existing myminio/cuspia; exit 0; "
    networks:
      - internal

  # ==========================================
  # APPLICATION
  # ==========================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cuspia_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      postgres-central:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-cuspia}:${DB_PASSWORD}@postgres:5432/dental_erp
      CENTRAL_DATABASE_URL: postgresql://${DB_USER:-cuspia}:${DB_PASSWORD}@postgres-central:5432/cuspia_central
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_BUCKET: cuspia
      S3_REGION: us-east-1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-soporte@cuspia.com}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: cuspia_frontend
    restart: always
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ==========================================
  # REVERSE PROXY (Nginx)
  # ==========================================

  nginx:
    image: nginx:alpine
    container_name: cuspia_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # SSL certificate renewal
  certbot:
    image: certbot/certbot
    container_name: cuspia_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  postgres_central_data:
  redis_data:
  minio_data:


networks:
  internal:
    driver: bridge
