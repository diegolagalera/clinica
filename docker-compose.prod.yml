# =============================================
#  CUSPIA-ERP — Production Docker Compose
# =============================================
#  Usage:
#    cp .env.prod.example .env.prod
#    # Edit .env.prod with your real values
#    docker compose -f docker-compose.prod.yml up -d --build
# =============================================

services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: cuspia_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-cuspia}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dental_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-cuspia}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: cuspia_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ==========================================
  # APPLICATION
  # ==========================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cuspia_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Europe/Madrid
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-cuspia}:${DB_PASSWORD}@postgres:5432/dental_erp
      CENTRAL_DATABASE_URL: postgresql://${DB_USER:-cuspia}:${DB_PASSWORD}@postgres:5432/cuspia_central
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      S3_ENDPOINT: https://${S3_LOCATION:-nbg1}.your-objectstorage.com
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: cuspia
      S3_REGION: ${S3_LOCATION:-nbg1}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-soporte@cuspia.com}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SIGNNOW_API_KEY: ${SIGNNOW_API_KEY:-}
      SIGNNOW_API_URL: ${SIGNNOW_API_URL:-https://api.signnow.com}
      SIGNNOW_EMAIL: ${SIGNNOW_EMAIL:-}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: cuspia_frontend
    restart: always
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ==========================================
  # REVERSE PROXY (Nginx)
  # ==========================================

  nginx:
    image: nginx:alpine
    container_name: cuspia_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # SSL certificate renewal
  certbot:
    image: certbot/certbot
    container_name: cuspia_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:


networks:
  internal:
    driver: bridge
