# =============================================
#  CUSPIA-ERP — Nginx Reverse Proxy
#  Handles: SSL termination, subdomain routing,
#           WebSocket proxying, static file serving
# =============================================

events {
    worker_connections 1024;
}

http {
    # ---------- General ----------
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ---------- Upstream servers ----------
    upstream backend {
        server backend:3000;
    }

    upstream frontend {
        server frontend:80;
    }

    # ---------- Rate limiting ----------
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ---------- HTTP → HTTPS redirect ----------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- API Backend (api.cuspia.com) ----------
    server {
        listen 443 ssl;
        server_name api.cuspia.com;

        ssl_certificate /etc/letsencrypt/live/cuspia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cuspia.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # API requests
        location / {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (Socket.io)
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }

    # ---------- Frontend (app.cuspia.com + *.cuspia.com subdomains) ----------
    server {
        listen 443 ssl;
        server_name app.cuspia.com *.cuspia.com;

        ssl_certificate /etc/letsencrypt/live/cuspia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cuspia.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
